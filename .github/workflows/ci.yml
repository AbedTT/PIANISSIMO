name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # PHP runs the API integration test (src/cloud/server.test.ts) against a throw-away SQLite database
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Check the realtime service and scripts parse
        run: for f in realtime/server.mjs scripts/*.mjs; do node --check "$f"; done

      # type-checks the app and the tests, then scripts/lint.mjs (project rules, php -l)
      - name: Lint and type-check
        run: npm run lint

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npx vite build

      # headless Chrome (preinstalled on GitHub's Ubuntu runners) driven over the DevTools protocol
      - name: End-to-end browser tests
        run: npm run e2e

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # the same API tests (including backup and restore) on MySQL, which larger sites use
  mysql:
    name: API tests on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pianissimo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring
          coverage: none

      - run: npm ci

      - name: API tests on MySQL 8
        run: npx vitest run src/cloud/server.test.ts
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=pianissimo_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
