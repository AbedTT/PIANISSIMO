<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score · Pianissimo</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𝄞</text></svg>" />
    <style>
      :root { --ink: #000; --muted: rgba(60, 60, 67, 0.6); --line: rgba(60, 60, 67, 0.18); --accent: #007aff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, Roboto, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); background: #fff; display: flex; flex-direction: column; }
      .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
      .bar .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar .by { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar .meta { min-width: 0; flex: 1; }
      .play { border: 0; border-radius: 999px; width: 36px; height: 36px; flex: none; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
      .play:focus-visible { outline: 3px solid rgba(59, 91, 219, 0.4); outline-offset: 2px; }
      .brand { color: var(--muted); font-size: 12px; text-decoration: none; white-space: nowrap; flex: none; }
      .brand:hover { color: var(--accent); }
      .sheet { flex: 1; overflow: auto; position: relative; padding: 8px 0; }
      .playhead { position: absolute; width: 3px; background: #2f9e44; border-radius: 2px; display: none; pointer-events: none; }
      .msg { padding: 24px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <div class="bar">
      <button class="play" id="ePlay" aria-label="Play" disabled>▶</button>
      <div class="meta">
        <div class="t" id="eTitle">Loading…</div>
        <div class="by" id="eBy"></div>
      </div>
      <a class="brand" id="eOpen" target="_blank" rel="noopener">𝄞 Pianissimo ↗</a>
    </div>
    <div class="sheet" id="eSheet">
      <div id="eScore"></div>
      <div class="playhead" id="ePlayhead"></div>
    </div>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
